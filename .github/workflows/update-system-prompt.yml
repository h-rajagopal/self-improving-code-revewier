# System Prompt Updater Workflow
# Triggered when a PR is merged to analyze review comments and update the system prompt
name: Update System Prompt

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  update-prompt:
    # Only run if the PR was merged (not just closed)
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.workspace }}/.github/scripts/requirements.txt

      - name: Analyze review comments and update system prompt
        id: update-prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SYSTEM_PROMPT_FILE: ${{ vars.SYSTEM_PROMPT_FILE || '.github/prompts/system_prompt.md' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python ${{ github.workspace }}/.github/scripts/prompt_updater.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code ${{ vars.SYSTEM_PROMPT_FILE || '.github/prompts/system_prompt.md' }} || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request for prompt update
        if: steps.git-check.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update system prompt based on PR #${{ github.event.pull_request.number }} review insights"
          branch: update-system-prompt-${{ github.event.pull_request.number }}
          delete-branch: true
          title: "🤖 Update System Prompt - Insights from PR #${{ github.event.pull_request.number }}"
          body: |
            ## Automated System Prompt Update
            
            This PR contains updates to the system prompt based on review insights from PR #${{ github.event.pull_request.number }}.
            
            ### Changes Made
            The AI has analyzed the human review comments from the merged PR and identified patterns or feedback that should be incorporated into the system prompt to improve future code reviews.
            
            ### Review Checklist
            - [ ] Review the proposed changes to ensure they align with team standards
            - [ ] Verify the updates don't conflict with existing guidelines
            - [ ] Test the updated prompt with sample code reviews if needed
            
            ---
            *This PR was automatically generated by the Self-Improving Code Review Agent*
          labels: |
            automated
            system-prompt
            enhancement

